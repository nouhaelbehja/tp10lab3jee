<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mon profil · Campus Secure</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header th:replace="~{fragments :: navigation}"></header>
<main class="container"><span class="badge">Identité universitaire</span><h1>Mon profil</h1>
    <section class="card"><h2>Informations personnelles</h2>
        <dl><dt>Nom</dt><dd th:text="${profile.name}"></dd>
            <dt>Adresse e-mail</dt><dd th:text="${profile.email}"></dd>
            <dt>Filière / service</dt><dd th:text="${profile.department}"></dd>
            <dt>Numéro étudiant / matricule</dt><dd th:text="${profile.studentNumber}"></dd>
        </dl>
        <p class="muted">Profil de démonstration consultable uniquement. Les données sont définies en mémoire.</p>
    </section>
</main></body></html>
